<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="healGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#76ff03" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#003311" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b2ff59"/>
      <stop offset="40%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <filter id="sacredGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Resplandor místico sagrado -->
  <circle cx="100" cy="100" r="80" fill="url(#healGlow)"/>

  <!-- Espiral de regeneración -->
  <path d="M100,30 A70,70 0 1,1 99,30" fill="none" stroke="#76ff03" stroke-width="2" stroke-dasharray="8,6" opacity="0.6"/>
  <path d="M100,45 A55,55 0 1,0 101,45" fill="none" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.7"/>

  <!-- Cuerpo de la Semilla del Ermitaño (Forma de judía / frijol sagrado) -->
  <g filter="url(#sacredGlow)">
    <path d="M75,65 C60,85 58,125 78,145 C95,160 125,155 138,135 C150,115 145,80 128,68 C110,55 88,50 75,65 Z"
          fill="url(#beanGrad)" stroke="#b2ff59" stroke-width="2.5"/>

    <!-- Hendidura característica de la semilla -->
    <path d="M88,85 Q82,105 92,125" fill="none" stroke="#1b5e20" stroke-width="3" stroke-linecap="round"/>

    <!-- Brillo y reflejo de vitalidad -->
    <ellipse cx="118" cy="80" rx="14" ry="7" fill="#ffffff" opacity="0.65" transform="rotate(-30 118 80)"/>
  </g>

  <!-- Partículas de energía de recuperación -->
  <circle cx="45" cy="70" r="3" fill="#ffd700" filter="url(#sacredGlow)"/>
  <circle cx="155" cy="65" r="3.5" fill="#76ff03" filter="url(#sacredGlow)"/>
  <circle cx="60" cy="155" r="2.5" fill="#ffffff"/>
  <circle cx="145" cy="150" r="3" fill="#ffd700"/>
</svg>
