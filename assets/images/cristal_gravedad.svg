<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="crystalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b026ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00f3ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#050212" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="facetA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#3d0099"/>
    </linearGradient>
    <linearGradient id="facetB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d166ff"/>
      <stop offset="100%" stop-color="#0b1b4f"/>
    </linearGradient>
    <linearGradient id="facetC" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#140033"/>
    </linearGradient>
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aura exterior de gravedad -->
  <circle cx="100" cy="100" r="85" fill="url(#crystalGlow)"/>

  <!-- Anillos gravitacionales rotantes -->
  <ellipse cx="100" cy="100" rx="75" ry="24" fill="none" stroke="#00f3ff" stroke-width="1.8" stroke-dasharray="8,6" opacity="0.6" transform="rotate(-25 100 100)"/>
  <ellipse cx="100" cy="100" rx="75" ry="24" fill="none" stroke="#d166ff" stroke-width="1.8" stroke-dasharray="10,8" opacity="0.6" transform="rotate(35 100 100)"/>

  <!-- Cristal Central -->
  <g filter="url(#coreGlow)">
    <!-- Faceta Superior Izquierda -->
    <polygon points="100,25 65,90 100,105" fill="url(#facetA)" stroke="#00f3ff" stroke-width="1.5"/>
    <!-- Faceta Superior Derecha -->
    <polygon points="100,25 135,90 100,105" fill="url(#facetB)" stroke="#d166ff" stroke-width="1.5"/>
    <!-- Faceta Frontal Superior -->
    <polygon points="100,25 80,85 100,105 120,85" fill="url(#facetC)" opacity="0.85"/>

    <!-- Faceta Inferior Izquierda -->
    <polygon points="100,105 65,90 100,175" fill="url(#facetB)" stroke="#00f3ff" stroke-width="1.5"/>
    <!-- Faceta Inferior Derecha -->
    <polygon points="100,105 135,90 100,175" fill="url(#facetA)" stroke="#d166ff" stroke-width="1.5"/>
    <!-- Brillo central -->
    <polygon points="100,105 85,100 100,160 115,100" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- Partículas de energía gravitacional -->
  <circle cx="55" cy="50" r="3.5" fill="#00f3ff" filter="url(#coreGlow)"/>
  <circle cx="145" cy="150" r="3.5" fill="#d166ff" filter="url(#coreGlow)"/>
  <circle cx="150" cy="45" r="2.5" fill="#ffffff"/>
  <circle cx="50" cy="140" r="2.5" fill="#00f3ff"/>
</svg>
