<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="radarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#052814"/>
      <stop offset="70%" stop-color="#021408"/>
      <stop offset="100%" stop-color="#000803"/>
    </radialGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#70757a"/>
      <stop offset="100%" stop-color="#2a2e33"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Botón superior -->
  <rect x="88" y="10" width="24" height="18" rx="4" fill="url(#metalRim)" stroke="#00ff66" stroke-width="1.5"/>

  <!-- Anillo exterior metálico -->
  <circle cx="100" cy="108" r="82" fill="url(#metalRim)" stroke="#111" stroke-width="4"/>
  <circle cx="100" cy="108" r="74" fill="#181c20" stroke="#00ff66" stroke-width="2"/>

  <!-- Pantalla del radar -->
  <circle cx="100" cy="108" r="68" fill="url(#radarBg)"/>

  <!-- Rejilla de coordenadas -->
  <circle cx="100" cy="108" r="50" fill="none" stroke="#00ff66" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <circle cx="100" cy="108" r="30" fill="none" stroke="#00ff66" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
  <circle cx="100" cy="108" r="10" fill="none" stroke="#00ff66" stroke-width="1" opacity="0.8"/>
  
  <line x1="100" y1="40" x2="100" y2="176" stroke="#00ff66" stroke-width="1" opacity="0.5"/>
  <line x1="32" y1="108" x2="168" y2="108" stroke="#00ff66" stroke-width="1" opacity="0.5"/>
  <line x1="52" y1="60" x2="148" y2="156" stroke="#00ff66" stroke-width="0.8" opacity="0.3"/>
  <line x1="52" y1="156" x2="148" y2="60" stroke="#00ff66" stroke-width="0.8" opacity="0.3"/>

  <!-- Barrido de radar -->
  <path d="M100,108 L142,66 A68,68 0 0,0 100,40 Z" fill="#00ff66" opacity="0.25"/>

  <!-- Señal de Ki de Vegeta (Punto amarillo/dorado titilante) -->
  <circle cx="125" cy="85" r="7" fill="#ffd700" filter="url(#glow)"/>
  <circle cx="125" cy="85" r="4" fill="#ffffff"/>
  <circle cx="125" cy="85" r="11" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.8"/>

  <!-- Reflejo de cristal -->
  <path d="M50,75 A60,60 0 0,1 150,75 A68,68 0 0,0 50,75 Z" fill="#ffffff" opacity="0.15"/>
</svg>
